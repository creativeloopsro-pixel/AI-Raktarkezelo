name: ai-raktar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_raktar}
      POSTGRES_USER: ${POSTGRES_USER:-ai_raktar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_raktar}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_raktar} -d ${POSTGRES_DB:-ai_raktar}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      - internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ai-raktar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data
    networks:
      - internal

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://ai_raktar:ai_raktar@postgres:5432/ai_raktar}
      APP_OBJECT_STORE_BACKEND: ${APP_OBJECT_STORE_BACKEND:-s3}
      APP_S3_ENDPOINT_URL: ${APP_S3_ENDPOINT_URL:-http://minio:9000}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:-ai-raktar}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:-change-this-minio-password}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-ai-raktar-documents}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-disabled}
      APP_OLLAMA_BASE_URL: ${APP_OLLAMA_BASE_URL:-https://ollama.com}
      APP_OLLAMA_API_KEY: ${APP_OLLAMA_API_KEY:-}
      APP_OLLAMA_MODEL: ${APP_OLLAMA_MODEL:-gemma4:31b}
      APP_AI_STRUCTURED_OUTPUT_ENABLED: ${APP_AI_STRUCTURED_OUTPUT_ENABLED:-true}
      APP_AI_TIMEOUT_SECONDS: ${APP_AI_TIMEOUT_SECONDS:-300}
      APP_AI_AUTO_CONFIRM_RECEIPTS: ${APP_AI_AUTO_CONFIRM_RECEIPTS:-true}
      APP_AI_AUTO_CONFIRM_MIN_CONFIDENCE: ${APP_AI_AUTO_CONFIRM_MIN_CONFIDENCE:-0.98}
      APP_EMAIL_INBOUND_DOMAIN: ${APP_EMAIL_INBOUND_DOMAIN:-inbound.localhost}
      APP_EMAIL_WEBHOOK_SECRET: ${APP_EMAIL_WEBHOOK_SECRET:-}
      APP_EMAIL_WEBHOOK_MAX_AGE_SECONDS: ${APP_EMAIL_WEBHOOK_MAX_AGE_SECONDS:-300}
      APP_EMAIL_MAX_MESSAGE_MB: ${APP_EMAIL_MAX_MESSAGE_MB:-30}
      APP_EMAIL_MAX_ATTACHMENTS: ${APP_EMAIL_MAX_ATTACHMENTS:-20}
      APP_PLUGIN_API_VERSION: ${APP_PLUGIN_API_VERSION:-1}
      APP_PLUGIN_JOB_TIMEOUT_SECONDS: ${APP_PLUGIN_JOB_TIMEOUT_SECONDS:-60}
      APP_PLUGIN_MAX_RETRIES: ${APP_PLUGIN_MAX_RETRIES:-3}
      APP_PLUGIN_DISPATCHER_POLL_SECONDS: ${APP_PLUGIN_DISPATCHER_POLL_SECONDS:-5}
      APP_PLUGIN_DISPATCH_BATCH_SIZE: ${APP_PLUGIN_DISPATCH_BATCH_SIZE:-100}
      APP_PLUGIN_RATE_LIMIT_PER_MINUTE: ${APP_PLUGIN_RATE_LIMIT_PER_MINUTE:-120}
      APP_INVENTORY_APPROVAL_THRESHOLD: ${APP_INVENTORY_APPROVAL_THRESHOLD:-100}
      APP_MFA_CHALLENGE_MINUTES: ${APP_MFA_CHALLENGE_MINUTES:-5}
      APP_MFA_ISSUER: ${APP_MFA_ISSUER:-AI Raktárkezelő}
      APP_MFA_ENFORCE_ADMIN: ${APP_MFA_ENFORCE_ADMIN:-false}
      APP_RESUMABLE_UPLOAD_EXPIRY_HOURS: ${APP_RESUMABLE_UPLOAD_EXPIRY_HOURS:-72}
      APP_RESUMABLE_UPLOAD_CHUNK_MB: ${APP_RESUMABLE_UPLOAD_CHUNK_MB:-1}
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://ai_raktar:ai_raktar@postgres:5432/ai_raktar}
      APP_OBJECT_STORE_BACKEND: ${APP_OBJECT_STORE_BACKEND:-s3}
      APP_S3_ENDPOINT_URL: ${APP_S3_ENDPOINT_URL:-http://minio:9000}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:-ai-raktar}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:-change-this-minio-password}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-ai-raktar-documents}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-disabled}
      APP_OLLAMA_BASE_URL: ${APP_OLLAMA_BASE_URL:-https://ollama.com}
      APP_OLLAMA_API_KEY: ${APP_OLLAMA_API_KEY:-}
      APP_OLLAMA_MODEL: ${APP_OLLAMA_MODEL:-gemma4:31b}
      APP_AI_STRUCTURED_OUTPUT_ENABLED: ${APP_AI_STRUCTURED_OUTPUT_ENABLED:-true}
      APP_AI_TIMEOUT_SECONDS: ${APP_AI_TIMEOUT_SECONDS:-300}
      APP_AI_AUTO_CONFIRM_RECEIPTS: ${APP_AI_AUTO_CONFIRM_RECEIPTS:-true}
      APP_AI_AUTO_CONFIRM_MIN_CONFIDENCE: ${APP_AI_AUTO_CONFIRM_MIN_CONFIDENCE:-0.98}
      APP_EMAIL_INBOUND_DOMAIN: ${APP_EMAIL_INBOUND_DOMAIN:-inbound.localhost}
      APP_EMAIL_WEBHOOK_SECRET: ${APP_EMAIL_WEBHOOK_SECRET:-}
      APP_EMAIL_WEBHOOK_MAX_AGE_SECONDS: ${APP_EMAIL_WEBHOOK_MAX_AGE_SECONDS:-300}
      APP_EMAIL_MAX_MESSAGE_MB: ${APP_EMAIL_MAX_MESSAGE_MB:-30}
      APP_EMAIL_MAX_ATTACHMENTS: ${APP_EMAIL_MAX_ATTACHMENTS:-20}
      APP_EMAIL_IMAP_ENABLED: ${APP_EMAIL_IMAP_ENABLED:-false}
      APP_EMAIL_IMAP_HOST: ${APP_EMAIL_IMAP_HOST:-}
      APP_EMAIL_IMAP_PORT: ${APP_EMAIL_IMAP_PORT:-993}
      APP_EMAIL_IMAP_USERNAME: ${APP_EMAIL_IMAP_USERNAME:-}
      APP_EMAIL_IMAP_PASSWORD: ${APP_EMAIL_IMAP_PASSWORD:-}
      APP_EMAIL_IMAP_MAILBOX: ${APP_EMAIL_IMAP_MAILBOX:-INBOX}
      APP_EMAIL_IMAP_USE_SSL: ${APP_EMAIL_IMAP_USE_SSL:-true}
      APP_EMAIL_IMAP_POLL_SECONDS: ${APP_EMAIL_IMAP_POLL_SECONDS:-60}
      APP_PLUGIN_API_VERSION: ${APP_PLUGIN_API_VERSION:-1}
      APP_PLUGIN_JOB_TIMEOUT_SECONDS: ${APP_PLUGIN_JOB_TIMEOUT_SECONDS:-60}
      APP_PLUGIN_MAX_RETRIES: ${APP_PLUGIN_MAX_RETRIES:-3}
      APP_PLUGIN_DISPATCHER_POLL_SECONDS: ${APP_PLUGIN_DISPATCHER_POLL_SECONDS:-5}
      APP_PLUGIN_DISPATCH_BATCH_SIZE: ${APP_PLUGIN_DISPATCH_BATCH_SIZE:-100}
      APP_PLUGIN_RATE_LIMIT_PER_MINUTE: ${APP_PLUGIN_RATE_LIMIT_PER_MINUTE:-120}
      APP_INVENTORY_APPROVAL_THRESHOLD: ${APP_INVENTORY_APPROVAL_THRESHOLD:-100}
    command:
      - /bin/sh
      - -c
      - python -m app.enqueue_pending && dramatiq app.tasks --processes 1 --threads 2
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
